# Push to main: test, typecheck, build (static pages plus the small edge
# worker for /api), deploy to Cloudflare Pages as production. Nitro writes
# dist/_worker.js/wrangler.json (with pages_build_output_dir: ".."), so
# wrangler runs with --cwd dist/_worker.js and uploads dist. Pull requests
# get a preview deployment on their branch alias. Secrets and variables the repo needs:
#   secrets.CLOUDFLARE_API_TOKEN     token with "Cloudflare Pages: Edit"
#   secrets.CLOUDFLARE_ACCOUNT_ID    the account the Pages project lives in
#   vars.CLOUDFLARE_PAGES_PROJECT    Pages project name (defaults to tmiladzi)
#   secrets.NUXT_PUBLIC_BOOKING_API  optional Apps Script /exec URL for submissions; blank = /api/send
#   vars.NUXT_ACCESS_TEAM_DOMAIN     Cloudflare Access team, e.g. xxx.cloudflareaccess.com (admin sign-in)
#   vars.NUXT_ACCESS_AUD             the Access application's Audience (AUD) tag (admin sign-in)
#   vars.CLOUDFLARE_D1_DATABASE_ID   id of the tmiladzi-cms D1 database; blank = no CMS, built-in prices
# With the database set, CLOUDFLARE_API_TOKEN also needs "D1: Edit".
# The NUXT_ACCESS_* and CLOUDFLARE_D1_DATABASE_ID values may be repository
# variables or repository secrets, but not "production" environment values:
# the build job has no environment, so it would never see them.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      # The site still builds without these: admin then refuses every request,
      # and without the database it serves the built-in prices. Say so in the
      # run summary rather than failing the deploy.
      - name: Check CMS settings
        env:
          TEAM: ${{ vars.NUXT_ACCESS_TEAM_DOMAIN || secrets.NUXT_ACCESS_TEAM_DOMAIN }}
          AUD: ${{ vars.NUXT_ACCESS_AUD || secrets.NUXT_ACCESS_AUD }}
          D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID || secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$TEAM" && test -n "$AUD" \
            || echo "::warning::NUXT_ACCESS_TEAM_DOMAIN / NUXT_ACCESS_AUD are not visible to the build; /admin will refuse every request unless they are Cloudflare Pages secrets"
          if [ -n "$D1_ID" ]; then
            echo "CMS database bound: ${D1_ID:0:8}…"
          else
            echo "::warning::CLOUDFLARE_D1_DATABASE_ID is not visible to the build (set it as a repository variable); the site will serve its built-in prices"
          fi

      - name: Build
        run: bun run build
        env:
          NUXT_PUBLIC_BOOKING_API: ${{ secrets.NUXT_PUBLIC_BOOKING_API }}
          NUXT_PUBLIC_SITE_URL: https://tmiladzi.com
          NUXT_ACCESS_TEAM_DOMAIN: ${{ vars.NUXT_ACCESS_TEAM_DOMAIN || secrets.NUXT_ACCESS_TEAM_DOMAIN }}
          NUXT_ACCESS_AUD: ${{ vars.NUXT_ACCESS_AUD || secrets.NUXT_ACCESS_AUD }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID || secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.publish.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tmiladzi' }}
      BRANCH: ${{ github.event_name == 'push' && 'main' || github.head_ref }}
      D1_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID || secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets are present
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is not set"; exit 1; }

      - name: Create the Pages project if it does not exist yet
        run: |
          if npx --yes wrangler@4 pages project list 2>/dev/null | grep -Eq "(^|[│| ])$PROJECT([│| ]|$)"; then
            echo "Project $PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main
          fi

      - name: Make sure the production branch is main
        # The project was first created with master as its production branch,
        # so deploys from main landed as previews. Fixes it once; no-op after.
        if: github.event_name == 'push'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          current=$(curl -sS "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("result",{}).get("production_branch",""))')
          if [ "$current" = "main" ]; then
            echo "Production branch is already main"
          else
            echo "Production branch is '$current'; setting it to main"
            curl -sS -X PATCH "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" --data '{"production_branch":"main"}' \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d); sys.exit(0 if d.get("success") else 1)' \
              || { echo "::error::Could not set the production branch to main; change it in the Pages dashboard"; exit 1; }
          fi

      # The CMS schema, before the code that needs it goes live. Production
      # only: previews read the same database but never change its shape.
      # The first run creates the tables and loads the current prices; later
      # runs apply only new files in server/database/migrations, so the
      # studio's edits are never overwritten.
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && env.D1_ID != ''
        with:
          path: repo
          sparse-checkout: server/database/migrations

      - name: Apply CMS database migrations
        if: github.event_name == 'push' && env.D1_ID != ''
        working-directory: repo
        run: |
          cat > wrangler.migrate.json <<EOF
          { "name": "tmiladzi", "d1_databases": [{ "binding": "DB", "database_name": "tmiladzi-cms",
            "database_id": "$D1_ID", "migrations_dir": "server/database/migrations" }] }
          EOF
          npx --yes wrangler@4 d1 migrations apply DB --remote -c wrangler.migrate.json

      - name: Publish
        id: publish
        env:
          MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || 'manual run' }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 --cwd dist/_worker.js pages deploy \
            --project-name="$PROJECT" \
            --branch="$BRANCH" \
            --commit-hash="${{ github.event.pull_request.head.sha || github.sha }}" \
            --commit-message="$(printf '%s' "$MESSAGE" | head -1 | cut -c1-120)" \
            | tee deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
